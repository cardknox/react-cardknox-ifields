# Clean install of node dependencies, build both packages and run tests.
#
# Every dependency install in this workflow is gated by Aikido Safe Chain, which
# screens packages against Aikido Intel and blocks anything flagged as malware
# before its tarball (or its install script) reaches the runner.
# Docs: https://github.com/AikidoSec/safe-chain

name: build

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.x
  # Node 20 ships npm 10, which tries to materialise optional peer
  # dependencies that the newer npm maintaining our lockfiles omits - it fails
  # `npm ci` in test/ on postcss-load-config's optional `yaml` peer. Node stays
  # on 20 for react-scripts/jest compatibility, so pin npm separately.
  NPM_VERSION: 11
  # Pinned to an immutable GitHub release asset and checksum-verified on download.
  # Bump both values together: https://github.com/AikidoSec/safe-chain/releases
  SAFE_CHAIN_RELEASE: 1.5.15
  SAFE_CHAIN_SHA256: de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Deliberately no npm cache. The gate only works if every tarball is
      # fetched through Safe Chain rather than replayed from a warm ~/.npm, so a
      # cache hit here would silently skip the malware check.
      # package-manager-cache must stay off explicitly - setup-node v5+ turns
      # caching on by itself once package.json gains a "packageManager" field.
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Must run after setup-node so the Safe Chain shims are prepended to PATH
      # ahead of the Node toolchain's own npm.
      - name: Install Aikido Safe Chain
        run: |
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_RELEASE}/install-safe-chain.sh" -o /tmp/install-safe-chain.sh
          echo "${SAFE_CHAIN_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh

      # PATH updates from the step above only apply to subsequent steps.
      - name: Report Safe Chain version
        run: safe-chain --version

      # Installed through the shims above, so the upgrade is itself gated. The
      # canary below then runs against the npm that performs the real installs.
      - name: Pin npm to ${{ env.NPM_VERSION }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      # Proves the gate is armed. The installer only warns if its setup step
      # fails, so without this a Safe Chain install that never hooked npm would
      # leave every check below green while protecting nothing.
      - name: Verify Safe Chain blocks a known-malicious package
        run: |
          mkdir -p "${RUNNER_TEMP}/safe-chain-canary"
          cd "${RUNNER_TEMP}/safe-chain-canary"
          npm init -y > /dev/null
          if npm install safe-chain-test --no-audit --no-fund; then
            echo "::error::Aikido Safe Chain did not block the safe-chain-test canary package - the supply-chain gate is NOT active."
            exit 1
          fi
          echo "Safe Chain blocked the canary package as expected."

      # The two packages have separate lockfiles and dependabot bumps both, so
      # both installs have to go through the gate.
      - name: Install library dependencies through Safe Chain
        working-directory: react-cardknox-ifields
        run: npm ci

      # Must build before the test app installs: the test app consumes the
      # library through a file: dependency resolved to its build/ output.
      - name: Build library
        working-directory: react-cardknox-ifields
        run: npm run build

      - name: Install test app dependencies through Safe Chain
        working-directory: test
        run: npm ci

      - name: Build test app
        working-directory: test
        run: npm run build

      # --passWithNoTests because the repo currently has no test files; remove it
      # once real tests land so an empty suite stops counting as a pass.
      - name: Test
        working-directory: test
        run: npm test -- --passWithNoTests
